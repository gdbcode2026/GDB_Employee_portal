name: gdb-platform-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gdb_local
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: platform_admin
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdb_local -d platform_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gdb_local
      RABBITMQ_DEFAULT_PASS: local-development-only
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  minio:
    # MinIO's own image (minio/minio on Docker Hub, quay.io/minio/minio on Quay) has been
    # withdrawn from public/anonymous pull on both registries - confirmed directly against each
    # registry's own token/API responses, not a local Docker or repo issue. zenko/cloudserver is
    # a real, actively-maintained, publicly pullable, S3-API-compatible server (Scality) used as
    # the local-dev replacement; the service key stays "minio" only because nothing else in this
    # compose file or the application connects to it by that Compose-internal name - the app
    # always reaches this container via the published host port below, never Docker DNS.
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: gdb_local
      SCALITY_SECRET_ACCESS_KEY: local-development-only
    # Private by default: every CloudServer S3 API call requires a valid SigV4-signed request
    # (verified directly - an unsigned GET is rejected), and nothing here applies a public/
    # anonymous bucket policy. CloudServer has no separate admin console (unlike MinIO's 9090).
    ports: ["127.0.0.1:9000:8000"]
    volumes:
      - object-storage-data:/usr/src/app/localData
      - object-storage-metadata:/usr/src/app/localMetadata
    healthcheck:
      # CloudServer exposes no dedicated health endpoint - every path, including "/", is routed
      # through its S3 API handler. Verified directly against a running container: once the
      # server is up, an unsigned GET to "/" reliably returns a well-formed HTTP response (403
      # AccessDenied), and plain `curl` (without -f) exits 0 for that response - so this checks
      # that the HTTP listener is actually up and answering, the same signal -f would give for a
      # 2xx-only API, without wrongly treating a correct 403 as unhealthy.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    # Approved OIDC provider decision (Production Authentication Phase 1 review). Local
    # development only - see docs/security/KEYCLOAK_LOCAL_DEVELOPMENT.md for the full setup,
    # realm/client/role/test-user inventory, and reset procedure. Pin bumped by the team to the
    # latest stable 26.x/27.x patch at their discretion; 26.0 is confirmed real/published, not
    # necessarily the newest patch as of any given day.
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      # Admin console login only - distinct from, and unrelated to, any application identity.
      # Same dev-only-credential convention as every other service in this file.
      KC_BOOTSTRAP_ADMIN_USERNAME: gdb_local
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-development-only
      # Dedicated database - never a domain-service database (employee_db, payroll_db, etc.).
      # keycloak_db/gdb_keycloak are created by postgres/init-databases.sql, exactly like every
      # other service's own isolated database/user pair.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: gdb_keycloak
      KC_DB_PASSWORD: local-development-only
      # Must match how the host (and, later, the BFF/gateway/services running on the host during
      # local dev) actually reaches this container, so the `iss` claim on every issued token is
      # exactly http://localhost:8180/realms/gdb - matching what `JwtDecoders.fromIssuerLocation`
      # will be configured with. Full-URL form is Keycloak 26's current ("v2") hostname option;
      # confirmed by reading the realm's own /.well-known/openid-configuration after startup.
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback-only, same posture as every other service here. Only the combined OIDC/admin-
    # console port is published - the separate health/management port (9000 internally) is
    # deliberately NOT published to the host; Docker's healthcheck below reaches it from inside
    # the container's own network namespace, so nothing beyond local developers hitting 8180 for
    # the admin console/OIDC endpoints is ever exposed.
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak's optimized image ships no curl/wget; this is Keycloak's own documented
      # container health-check pattern (a raw HTTP/1.1 request over bash's /dev/tcp), reading the
      # management-interface health endpoint from inside the container. If a future image variant
      # lacks bash's /dev/tcp support, this check should be removed rather than left flapping -
      # it is explicitly optional per this task's "if practical" instruction.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # Unlike the other services in this file (no restart policy = Docker's default "no"),
    # Keycloak's slower startup (realm import against a real Postgres dependency) makes it worth
    # surviving an incidental container stop/host reboot during a long local dev session, without
    # restarting after an explicit `docker stop` - a deliberate, scoped deviation for this one
    # service only, per this task's explicit "restart policy appropriate for local development"
    # requirement.
    restart: unless-stopped
volumes:
  postgres-data:
  object-storage-data:
  object-storage-metadata:
