name: gdb-platform-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gdb_local
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: platform_admin
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdb_local -d platform_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gdb_local
      RABBITMQ_DEFAULT_PASS: local-development-only
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    environment:
      MINIO_ROOT_USER: gdb_local
      MINIO_ROOT_PASSWORD: local-development-only
    # Private by default: MinIO grants no anonymous/public access to a bucket unless a policy is
    # explicitly applied, and nothing here ever applies one. The console (9090) is for local
    # operator visibility only - bound to loopback, like every other service's ports below.
    command: ["server", "/data", "--console-address", ":9090"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9090:9090"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  minio-data:
