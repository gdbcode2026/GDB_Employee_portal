spring:
  application.name: audit-service
  datasource.url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit_db}
  datasource.username: ${AUDIT_DB_USERNAME:gdb_audit}
  datasource.password: ${AUDIT_DB_PASSWORD:local-development-only}
  jpa.open-in-view: false
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
  rabbitmq.host: ${RABBITMQ_HOST:localhost}
  rabbitmq.port: ${RABBITMQ_PORT:5672}
  rabbitmq.username: ${RABBITMQ_USERNAME:gdb_local}
  rabbitmq.password: ${RABBITMQ_PASSWORD:local-development-only}
  rabbitmq.listener.simple.retry:
    enabled: true
    max-attempts: 3
    initial-interval: 1000
    multiplier: 2
    max-interval: 10000
management.endpoints.web.exposure.include: health,info,metrics
management.endpoint.health.probes.enabled: true
logging.structured.format.console: logstash
