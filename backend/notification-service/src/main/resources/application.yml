server.port: ${SERVER_PORT:8082}
spring:
  application.name: notification-service
  datasource.url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
  datasource.username: ${NOTIFICATION_DB_USERNAME:gdb_notification}
  datasource.password: ${NOTIFICATION_DB_PASSWORD:local-development-only}
  jpa.open-in-view: false
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
  rabbitmq.host: ${RABBITMQ_HOST:localhost}
  rabbitmq.port: ${RABBITMQ_PORT:5672}
  rabbitmq.username: ${RABBITMQ_USERNAME:gdb_local}
  rabbitmq.password: ${RABBITMQ_PASSWORD:local-development-only}
  rabbitmq.listener.simple.retry:
    enabled: true
    max-attempts: 3
    initial-interval: 1000
    multiplier: 2
    max-interval: 10000
management.endpoints.web.exposure.include: health,info,metrics
management.endpoint.health.probes.enabled: true
logging.structured.format.console: logstash
gdb.clients.employee-service.base-url: ${GDB_EMPLOYEE_SERVICE_URI:http://localhost:8084}
