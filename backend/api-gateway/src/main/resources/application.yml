spring:
  application.name: api-gateway
  data.redis.host: ${REDIS_HOST:localhost}
  data.redis.port: ${REDIS_PORT:6379}
  cloud.gateway.server.webflux.routes:
    - id: audit-service
      uri: ${GDB_GATEWAY_AUDIT_SERVICE_URI:http://localhost:8081}
      predicates: [ Path=/api/v1/audit/** ]
    - id: notification-service
      uri: ${GDB_GATEWAY_NOTIFICATION_SERVICE_URI:http://localhost:8082}
      predicates: [ Path=/api/v1/notifications/** ]
    - id: organization-service
      uri: ${GDB_GATEWAY_ORGANIZATION_SERVICE_URI:http://localhost:8083}
      predicates: [ Path=/api/v1/organization/** ]
    - id: employee-service
      uri: ${GDB_GATEWAY_EMPLOYEE_SERVICE_URI:http://localhost:8084}
      predicates: [ Path=/api/v1/employees/** ]
    - id: attendance-service
      uri: ${GDB_GATEWAY_ATTENDANCE_SERVICE_URI:http://localhost:8085}
      predicates: [ Path=/api/v1/attendance/** ]
    - id: leave-service
      uri: ${GDB_GATEWAY_LEAVE_SERVICE_URI:http://localhost:8086}
      predicates: [ Path=/api/v1/leave/** ]
    - id: project-service
      uri: ${GDB_GATEWAY_PROJECT_SERVICE_URI:http://localhost:8087}
      predicates: [ "Path=/api/v1/projects/**,/api/v1/tasks/**" ]
    - id: performance-service
      uri: ${GDB_GATEWAY_PERFORMANCE_SERVICE_URI:http://localhost:8088}
      predicates: [ Path=/api/v1/performance/** ]
    - id: document-service
      uri: ${GDB_GATEWAY_DOCUMENT_SERVICE_URI:http://localhost:8089}
      predicates: [ "Path=/api/v1/documents/**,/api/v1/policies/**" ]
management.endpoints.web.exposure.include: health,info,metrics
management.endpoint.health.probes.enabled: true
logging.structured.format.console: logstash
gdb.gateway.audit-service-uri: ${GDB_GATEWAY_AUDIT_SERVICE_URI:http://localhost:8081}
gdb.gateway.notification-service-uri: ${GDB_GATEWAY_NOTIFICATION_SERVICE_URI:http://localhost:8082}
gdb.gateway.organization-service-uri: ${GDB_GATEWAY_ORGANIZATION_SERVICE_URI:http://localhost:8083}
gdb.gateway.employee-service-uri: ${GDB_GATEWAY_EMPLOYEE_SERVICE_URI:http://localhost:8084}
gdb.gateway.attendance-service-uri: ${GDB_GATEWAY_ATTENDANCE_SERVICE_URI:http://localhost:8085}
gdb.gateway.leave-service-uri: ${GDB_GATEWAY_LEAVE_SERVICE_URI:http://localhost:8086}
gdb.gateway.project-service-uri: ${GDB_GATEWAY_PROJECT_SERVICE_URI:http://localhost:8087}
gdb.gateway.performance-service-uri: ${GDB_GATEWAY_PERFORMANCE_SERVICE_URI:http://localhost:8088}
gdb.gateway.document-service-uri: ${GDB_GATEWAY_DOCUMENT_SERVICE_URI:http://localhost:8089}
